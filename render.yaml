# Provision a Node web service for Neon; do not replace an existing live static site in place.
services:
  - type: web
    name: drivex-neon-staging
    runtime: node
    plan: free
    autoDeployTrigger: off
    buildCommand: npm ci && npm run build && npm run check
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: 22.22.0
      - key: APP_ORIGIN
        sync: false
      - key: NEON_AUTH_URL
        sync: false
      - key: DATABASE_URL
        sync: false
# Add NEON_SERVICE_DATABASE_URL, Razorpay and Resend settings privately after
# provisioning restricted worker access. Never deploy MIGRATION_DATABASE_URL.
